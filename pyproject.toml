[project]
name = "gpu-fleet-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lucas Telles", email = "lucas.telles@inf.ufrgs.br" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.57.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
gpu-fleet-assistant = "gpu_fleet_assistant:main"
gpu-fleet-eval = "gpu_fleet_assistant.evals.runner:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
