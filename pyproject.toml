[project]
name = "gpu-fleet-assistant"
version = "0.1.0"
description = "Conversational AI assistant for querying shared GPU fleet resources with SQLite and Tool Calling"
readme = "README.md"
authors = [
    { name = "Lucas Telles", email = "lucas.telles@inf.ufrgs.br" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "openai>=3.57.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
gpu-fleet-assistant = "gpu_fleet_assistant:main"
gpu-fleet-eval = "gpu_fleet_assistant.evals.runner:main"
gpu-fleet-web = "gpu_fleet_assistant.web.app:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
